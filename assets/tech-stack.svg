<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Technology stack for reliable agentic AI systems</title>
  <desc id="desc">A layered architecture showing intelligence, interfaces, knowledge, reliability, and platform technologies.</desc>
  <defs>
    <linearGradient id="bg" x1="20" y1="0" x2="1180" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#11102A"/>
    </linearGradient>
    <linearGradient id="accent" x1="100" y1="80" x2="1080" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="flow" x1="150" y1="0" x2="1050" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#60A5FA" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="orbA">
      <stop stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB">
      <stop stop-color="#8B5CF6" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#93C5FD" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.46"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="500" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="500" fill="url(#bg)"/>
    <rect width="1200" height="500" fill="url(#grid)"/>
    <circle cx="100" cy="50" r="240" fill="url(#orbA)"/>
    <circle cx="1110" cy="455" r="280" fill="url(#orbB)"/>
    <rect x="34" y="32" width="1132" height="436" rx="24" stroke="#A5B4FC" stroke-opacity="0.14"/>

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <rect x="72" y="56" width="176" height="28" rx="14" fill="#0F1C2E" stroke="#22D3EE" stroke-opacity="0.32"/>
      <circle cx="91" cy="70" r="4" fill="#34D399"/>
      <text x="104" y="75" fill="#BDECF6" font-size="12" font-weight="700" letter-spacing="1.35">SYSTEM STACK</text>

      <text x="72" y="126" fill="#F8FAFC" font-size="31" font-weight="760" letter-spacing="-0.8">From evidence to reliable action</text>
      <text x="72" y="153" fill="#94A3B8" font-size="14" font-weight="520">A typed, observable, policy-aware foundation for high-stakes agentic systems.</text>

      <!-- Flow line -->
      <path d="M153 264H1047" stroke="url(#flow)" stroke-width="2" stroke-dasharray="6 9"/>
      <g fill="#7DD3FC" filter="url(#glow)">
        <circle cx="153" cy="264" r="3"/>
        <circle cx="377" cy="264" r="3"/>
        <circle cx="600" cy="264" r="3"/>
        <circle cx="823" cy="264" r="3"/>
        <circle cx="1047" cy="264" r="3"/>
      </g>

      <!-- Card 1 -->
      <g transform="translate(72 187)">
        <rect width="202" height="176" rx="20" fill="#0C1726" stroke="#22D3EE" stroke-opacity="0.30"/>
        <circle cx="28" cy="29" r="13" fill="#103144" stroke="#22D3EE" stroke-opacity="0.48"/>
        <path d="M22 29H34M28 23V35" stroke="#A5F3FC" stroke-width="1.6" stroke-linecap="round"/>
        <text x="50" y="34" fill="#E6F8FC" font-size="14" font-weight="720">INTELLIGENCE</text>
        <text x="18" y="69" fill="#7DD3FC" font-size="11" font-weight="700" letter-spacing="0.5">CORE</text>
        <g font-size="12" font-weight="600">
          <rect x="18" y="82" width="76" height="28" rx="9" fill="#102333"/><text x="56" y="100" text-anchor="middle" fill="#CFFAFE">Python</text>
          <rect x="103" y="82" width="81" height="28" rx="9" fill="#102333"/><text x="143.5" y="100" text-anchor="middle" fill="#CFFAFE">LangGraph</text>
          <rect x="18" y="118" width="82" height="28" rx="9" fill="#102333"/><text x="59" y="136" text-anchor="middle" fill="#CFFAFE">Pydantic</text>
          <rect x="109" y="118" width="75" height="28" rx="9" fill="#102333"/><text x="146.5" y="136" text-anchor="middle" fill="#CFFAFE">LLMs</text>
        </g>
      </g>

      <!-- Card 2 -->
      <g transform="translate(295 187)">
        <rect width="202" height="176" rx="20" fill="#0F1729" stroke="#60A5FA" stroke-opacity="0.30"/>
        <circle cx="28" cy="29" r="13" fill="#142A45" stroke="#60A5FA" stroke-opacity="0.52"/>
        <path d="M22 26H34M22 32H34" stroke="#BFDBFE" stroke-width="1.6" stroke-linecap="round"/>
        <text x="50" y="34" fill="#EFF6FF" font-size="14" font-weight="720">INTERFACES</text>
        <text x="18" y="69" fill="#93C5FD" font-size="11" font-weight="700" letter-spacing="0.5">TOOLS + APIS</text>
        <g font-size="12" font-weight="600">
          <rect x="18" y="82" width="78" height="28" rx="9" fill="#14243B"/><text x="57" y="100" text-anchor="middle" fill="#DBEAFE">FastAPI</text>
          <rect x="105" y="82" width="79" height="28" rx="9" fill="#14243B"/><text x="144.5" y="100" text-anchor="middle" fill="#DBEAFE">MCP</text>
          <rect x="18" y="118" width="83" height="28" rx="9" fill="#14243B"/><text x="59.5" y="136" text-anchor="middle" fill="#DBEAFE">Tool APIs</text>
          <rect x="110" y="118" width="74" height="28" rx="9" fill="#14243B"/><text x="147" y="136" text-anchor="middle" fill="#DBEAFE">REST</text>
        </g>
      </g>

      <!-- Card 3 -->
      <g transform="translate(518 187)">
        <rect width="202" height="176" rx="20" fill="#101B26" stroke="#34D399" stroke-opacity="0.30"/>
        <circle cx="28" cy="29" r="13" fill="#123127" stroke="#34D399" stroke-opacity="0.50"/>
        <ellipse cx="28" cy="25" rx="6" ry="3" stroke="#A7F3D0" stroke-width="1.4"/>
        <path d="M22 25V33C22 36 34 36 34 33V25M22 29C22 32 34 32 34 29" stroke="#A7F3D0" stroke-width="1.4"/>
        <text x="50" y="34" fill="#ECFDF5" font-size="14" font-weight="720">KNOWLEDGE</text>
        <text x="18" y="69" fill="#6EE7B7" font-size="11" font-weight="700" letter-spacing="0.5">GROUNDING</text>
        <g font-size="12" font-weight="600">
          <rect x="18" y="82" width="87" height="28" rx="9" fill="#132A23"/><text x="61.5" y="100" text-anchor="middle" fill="#D1FAE5">PostgreSQL</text>
          <rect x="114" y="82" width="70" height="28" rx="9" fill="#132A23"/><text x="149" y="100" text-anchor="middle" fill="#D1FAE5">RAG</text>
          <rect x="18" y="118" width="94" height="28" rx="9" fill="#132A23"/><text x="65" y="136" text-anchor="middle" fill="#D1FAE5">Vector Search</text>
          <rect x="121" y="118" width="63" height="28" rx="9" fill="#132A23"/><text x="152.5" y="136" text-anchor="middle" fill="#D1FAE5">Graph</text>
        </g>
      </g>

      <!-- Card 4 -->
      <g transform="translate(741 187)">
        <rect width="202" height="176" rx="20" fill="#17172A" stroke="#A78BFA" stroke-opacity="0.34"/>
        <circle cx="28" cy="29" r="13" fill="#282044" stroke="#A78BFA" stroke-opacity="0.52"/>
        <path d="M22 29L26 33L34 24" stroke="#DDD6FE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="50" y="34" fill="#F5F3FF" font-size="14" font-weight="720">RELIABILITY</text>
        <text x="18" y="69" fill="#C4B5FD" font-size="11" font-weight="700" letter-spacing="0.5">GUARDRAILS</text>
        <g font-size="11.5" font-weight="600">
          <rect x="18" y="82" width="103" height="28" rx="9" fill="#221C3B"/><text x="69.5" y="100" text-anchor="middle" fill="#EDE9FE">OpenTelemetry</text>
          <rect x="130" y="82" width="54" height="28" rx="9" fill="#221C3B"/><text x="157" y="100" text-anchor="middle" fill="#EDE9FE">Eval</text>
          <rect x="18" y="118" width="79" height="28" rx="9" fill="#221C3B"/><text x="57.5" y="136" text-anchor="middle" fill="#EDE9FE">OPA/Rego</text>
          <rect x="106" y="118" width="78" height="28" rx="9" fill="#221C3B"/><text x="145" y="136" text-anchor="middle" fill="#EDE9FE">Tracing</text>
        </g>
      </g>

      <!-- Card 5 -->
      <g transform="translate(964 187)">
        <rect width="164" height="176" rx="20" fill="#191724" stroke="#F472B6" stroke-opacity="0.28"/>
        <circle cx="28" cy="29" r="13" fill="#352034" stroke="#F472B6" stroke-opacity="0.46"/>
        <path d="M22 25H34V34H22Z M25 22V25M31 22V25" stroke="#FBCFE8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="50" y="34" fill="#FDF2F8" font-size="14" font-weight="720">PLATFORM</text>
        <text x="18" y="69" fill="#F9A8D4" font-size="11" font-weight="700" letter-spacing="0.5">DELIVERY</text>
        <g font-size="12" font-weight="600">
          <rect x="18" y="82" width="61" height="28" rx="9" fill="#2D1D2C"/><text x="48.5" y="100" text-anchor="middle" fill="#FCE7F3">Docker</text>
          <rect x="88" y="82" width="58" height="28" rx="9" fill="#2D1D2C"/><text x="117" y="100" text-anchor="middle" fill="#FCE7F3">Linux</text>
          <rect x="18" y="118" width="52" height="28" rx="9" fill="#2D1D2C"/><text x="44" y="136" text-anchor="middle" fill="#FCE7F3">Git</text>
          <rect x="79" y="118" width="67" height="28" rx="9" fill="#2D1D2C"/><text x="112.5" y="136" text-anchor="middle" fill="#FCE7F3">GitHub</text>
        </g>
      </g>

      <!-- Bottom philosophy bar -->
      <g transform="translate(72 400)">
        <rect width="1056" height="43" rx="14" fill="#0A1422" stroke="url(#accent)" stroke-opacity="0.28"/>
        <text x="528" y="27" text-anchor="middle" fill="#CBD5E1" font-size="12.5" font-weight="620" letter-spacing="0.25">typed state  ·  traceable tools  ·  grounded retrieval  ·  policy checks  ·  visible uncertainty  ·  human review</text>
      </g>
    </g>
  </g>
</svg>
