## Agentic AI

```mermaid
flowchart LR
    H[Human / Clinician] --> A[AI Application]
    A --> P[Plan]
    A --> R[Retrieve]
    A --> T[Use Tools]
    P --> L[LLM Core]
    R --> L
    T --> L
    L --> V{Verify}
    V -->|pass| O[Evidence-grounded Output]
    V -->|uncertain| X[Abstain / Human Review]
    V --> E[Trace + Evaluation]
```

<div align="center">

`intent → plan → retrieve → act → validate → explain → learn`

</div>

